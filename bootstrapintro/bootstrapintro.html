<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <div class = "container">

          <h1 class="text-center display-1 fg-danger border border-warning border-5">lost! - cute cat</h1>

          <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
          
              <div id="carouselExampleFade" class="carousel carousel-fade">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="cat_porch.jpeg" class="d-block w-100 rounded-5" alt="catPorch">
          </div>
          <div class="carousel-item">
            <img src="bereketSmile.jpeg" class="d-block w-100 rounded-5" alt="bereketSmile">
          </div>
          <div class="carousel-item">
            <img src="bereketSleep.jpeg" class="d-block w-100 rounded-5" alt="bereketSleep">
          </div>
        </div>
        <div>
          <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
            <span class="carousel-icon-prev" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
            <span class="carousel-icon-next" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
          <button type="button" class="theme-inverse btn-solid" disabled>
            Click me for free $ and good luck
          </button>
          
          <button type="button" class="theme-inverse btn-solid">
              <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="theme-inverse btn-solid-link">
              <svg class="bi me-5" width="16" height="16" aria-hidden="true">
              </svg>
              Click me for more info
          </button>

        <button class="form-control combobox-toggle" type="button"
            data-bs-toggle="combobox"
            data-bs-name="attribute"
            data-bs-placeholder="Let me guess..."
            data-bs-multiple="true">
        <span class="combobox-value">Let me guess...</span>
        <svg class="combobox-caret" width="10" height="16" viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z" fill="currentcolor"/></svg>
      </button>
      <div class="menu">
        <button class="menu-item" type="button" data-bs-value="guessAge">
          You're a 10-17 year-old hooper
          <svg class="menu-item-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 16 16"><path d="m2 7 4 5 8-8"/></svg>
        </button>
        <button class="menu-item" type="button" data-bs-value="loner">
          You're well known but not popular
          <svg class="menu-item-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 16 16"><path d="m2 7 4 5 8-8"/></svg>
        </button>
        <button class="menu-item" type="button" data-bs-value="streetSmart">
          You're street smart but not book smart
          <svg class="menu-item-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 16 16"><path d="m2 7 4 5 8-8"/></svg>
        </button>
        <button class="menu-item" type="button" data-bs-value="overthinker">
          You constantly overthink
          <svg class="menu-item-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 16 16"><path d="m2 7 4 5 8-8"/></svg>
        </button>
        <button class="menu-item" type="button" data-bs-value="loneHooper">
          You're under pressure and stressing with school, but you just wannt hoop
          <svg class="menu-item-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 16 16"><path d="m2 7 4 5 8-8"/></svg>
        </button>
        <button class="menu-item" type="button" data-bs-value="collectingHoopers ">
          Collecting hoopers 5/20k
          <svg class="menu-item-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 16 16"><path d="m2 7 4 5 8-8"/></svg>
        </button>
      </div>
    </div>
  </body>
</html>
