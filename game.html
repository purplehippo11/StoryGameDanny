<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="script.js" defer></script>
  </head>
  <link rel="stylesheet" href="style.css" />
  <style>
      body {
        background-color: black;
        color: white;
        font-family: courier new;
      }

      .heading {
        font-weight: bold;
        color: white;
        text-align: center;
        font-family: courier new;
      }

      .card{
        background-color: black;
        color: white;
        font-family: courier new;
        border: 2px solid white;
        padding: 20px;
        margin: 20px;
        text-align: center;
      }

      #inventory-display {
        padding: 0;
        text-decoration: underline;
      }
      
      #health-display {
        padding: 0;
        text-decoration: underline;
      }

      #time-display {
        padding: 0;
        text-decoration: underline;
      }

      .footer-bottom {
        text-align: center;
        border-top: 1px solid #333333;
        margin-top: 20px;
        padding-top: 20px;
        font-size: 14px;
        color: #b3b3b3;
      }

    </style>
  <body>
    <header>
      <nav class="navbar">
      <a href="index.html"><span style="color: magenta">Home</span></a>
      <a href="game.html"><span style="color: brown">Play the game</span></a>
    </nav>
    </header>

    <main>
      <header>
        <h1 id="scene-title"></h1>
        <h2 id="character-name"></h2>
      </header>

      <section>
        <p id="scene-text"></p>
      </section>

      <section>
        <div id="choices-container"></div>
      </section>

      <section>

        <p><strong>Current <span style="color: red">HP</span>:</strong></p>
        <ul>
          <li id="health-display">100</li>
        </ul>

        <p><strong>Inventory:</strong></p>
        <ul id="inventory-display"> </ul>

        <p><strong>Time:</strong></p>
        <p id="time-display"> </p>

      </section>
    </main>

    <footer>
      <div class = "footer-bottom">
      © 2026 Danny Studios. All rights reserved.
      </div>
    </footer>

  </body>
</html>
